# Dependency policy. `cargo deny check` runs in CI (see .github/workflows/ci.yml).
#
# The goal is not a zero-dependency tree; it is that every dependency is a
# deliberate choice with a known licence and no open advisory.

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Fail on vulnerabilities and on unmaintained crates we can act on. Warnings
# that need an upstream release are ignored explicitly below rather than by
# turning the whole class off.
yanked = "deny"
ignore = []

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "OpenSSL",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# Every wildcard in this graph is an in-tree path dependency: the `kc-*` crates are
# declared once in [workspace.dependencies] as `kc-core = { path = "crates/kc-core" }`
# and used as `kc-core.workspace = true`, which cargo-deny reports as a wildcard
# requirement (10 errors on an otherwise clean tree).
#
# `allow-wildcard-paths = true` is the documented knob for exactly that, but it does
# NOT apply here: it is restricted to *private* crates (crates.io forbids publishing
# a path dependency), and every workspace member inherits no `publish` key, i.e.
# cargo-deny classifies them as public. Setting `publish = false` in
# [workspace.package] does not help either - inheritance needs `publish.workspace =
# true` in each member, and cargo-deny then still treats them as public.
#
# So the check is relaxed to `allow` here, and the gap it leaves - a wildcard
# *registry* requirement - is closed by an explicit grep in the `audit` CI job
# (.github/workflows/ci.yml, "no wildcard version requirements"), which is stricter
# than this lint because it names the file and line. Verified with cargo-deny 0.20.2.
wildcards = "allow"
deny = [
  # A second TLS stack or HTTP client would double the audit surface.
  { name = "openssl-sys" },
]
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
