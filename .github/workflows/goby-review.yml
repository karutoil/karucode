name: Goby Review (verification test)

# A sandboxed, agentic review with a mechanical second opinion: the reviewer records the
# command that demonstrates each finding, and the harness re-runs it on the head and on the
# merge base before anything is published. Only "fails on head, passes on the base" is a bug
# this change introduces.
#
# The reviewer is `karutoil/goby` at a pinned commit, built here rather than pulled from a
# registry: this repository's token cannot read the fork's package, and a build from a pinned
# SHA is the same bytes with no visibility question.
#
# `GOBY_VERIFY=advisory`: reproduced findings are published with the command that reproduced
# them; the rest are published with a "Not reproduced" note. `required` would be stronger, but
# `goby-base` ships no Rust toolchain and no C compiler, so a `cargo test` probe is a setup
# error here and `required` would withhold most findings in this workspace. The reviewer said
# exactly that on the first run (pull/32, finding `069a75b60f`). To move to `required`: add
# rustup + build-essential to the image, `cargo fetch --locked` in both worktrees before the
# pass, and raise the probe budget below.
#
# The gate ("Goby Gate") is off. Turn it on only after this reviewer has run on a few real
# pull requests: with `required`, a high-severity claim nobody could reproduce fails the gate.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
      head:
        description: Head commit SHA
        required: true
      base:
        description: Base commit SHA
        required: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: goby-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

env:
  GOBY_REPO_UNDER_TEST: ${{ github.repository }}
  # Pinned: the fork's `main` after the verification pass merged. A reviewer that changes when
  # someone pushes is not evidence.
  GOBY_REVIEWER_REPO: karutoil/goby
  GOBY_REVIEWER_REF: 0ee1126f9d26b20f74664e65bfcd507d29986658

jobs:
  review:
    name: goby
    # Fork and Dependabot runs do not receive repository secrets, so they cannot reach the
    # model. Skip them instead of failing, and never fall back to `pull_request_target`.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the reviewer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.GOBY_REVIEWER_REPO }}
          ref: ${{ env.GOBY_REVIEWER_REF }}
          path: .goby
          fetch-depth: 1
          persist-credentials: false

      - name: Build the reviewer image
        run: |
          docker build -t goby-base .goby/base
          docker build -t goby-review -f .goby/review/Dockerfile .goby

      - name: Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The same gateway the zero-loop workflow uses. The key stays in the runner's
          # environment: goby writes it to a root-only file and the agent only ever sees a
          # dummy behind a loopback proxy.
          OPENAI_API_KEY: ${{ secrets.ZERO_LOOP_LLM_API_KEY }}
          # `custom` is any OpenAI-compatible endpoint. The host only, no `/v1`: the agent's
          # models file names the path, and the proxy prepends the upstream's own.
          GOBY_PROVIDER: custom
          GOBY_UPSTREAM: https://omni.karutoil.site
          GOBY_MODEL: ${{ vars.ZERO_LOOP_MODEL }}
          GOBY_REPO: ${{ env.GOBY_REPO_UNDER_TEST }}
          GOBY_PR: ${{ github.event.pull_request.number || inputs.pr }}
          GOBY_HEAD: ${{ github.event.pull_request.head.sha || inputs.head }}
          GOBY_BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
          # A review per push while this is being evaluated. The image default is 1: a later
          # push reuses the first review and the post-merge cleaner takes over.
          GOBY_MAX_ROUNDS: "0"
          # An 18.5k-line pull request is 146 files to navigate, not 50 turns and not ten
          # minutes. The deadline still ends the run; the caps only stop being the reason.
          GOBY_AGENT_TIMEOUT_S: "1200"
          GOBY_MAX_TURNS: "120"
          GOBY_MAX_TOOL_CALLS: "200"
          GOBY_VERIFY: advisory
          # Rust probes compile a workspace, not a snippet: the defaults (90s per probe, 300s
          # for the pass) are sized for a five-line script.
          GOBY_PROBE_TIMEOUT_S: "240"
          GOBY_VERIFY_BUDGET_S: "600"
          GOBY_MAX_PROBES: "10"
          GOBY_GATE: "off"
        run: |
          docker run --rm \
            -e GOBY_REPO -e GOBY_PR -e GOBY_HEAD -e GOBY_BASE \
            -e GITHUB_TOKEN -e OPENAI_API_KEY \
            -e GOBY_PROVIDER -e GOBY_UPSTREAM -e GOBY_MODEL \
            -e GOBY_VERIFY -e GOBY_GATE -e GOBY_MAX_ROUNDS \
            -e GOBY_AGENT_TIMEOUT_S -e GOBY_MAX_TURNS -e GOBY_MAX_TOOL_CALLS \
            -e GOBY_PROBE_TIMEOUT_S -e GOBY_VERIFY_BUDGET_S -e GOBY_MAX_PROBES \
            goby-review
