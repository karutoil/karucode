name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap, fast, and the one gate people actually notice. Kept separate so a
  # formatting nit reports in seconds instead of after a full test run.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # A tracked file that imports an untracked one produces a tree that does not
  # compile from a clean clone. That happened once; this job makes it loud.
  tracked:
    name: no untracked sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fail on untracked files
        run: |
          untracked=$(git status --porcelain --untracked-files=all | grep '^??' || true)
          if [ -n "$untracked" ]; then
            echo "::error::untracked files present; a clean clone would not build:"
            echo "$untracked"
            exit 1
          fi

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # The release profile is not the tested profile: `panic = "abort"` used to
  # disable the runtime's catch_unwind guards in release builds only. Running
  # the runtime suite under --release keeps that class of divergence visible.
  test-release:
    name: test release profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -p kc-runtime -p kc-tools

  # The README is the front door and the only prose file in the release tarball,
  # so its links, anchors and diagrams are checked rather than eyeballed. The
  # checker has its own tests: a guard nobody tests is a guard that rots.
  # Runs on its own: no toolchain, no cache, seconds to finish.
  readme:
    name: readme links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/test_check_readme.py
      - run: python3 scripts/check_readme.py

  docs:
    name: docs gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p kc-docs
      - name: docs/internal is up to date
        run: cargo run -p kc-docs -- --check

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # End-to-end against the deterministic mock provider: no network, no API key,
  # no cost. This is the regression gate for the harness itself.
  e2e:
    name: e2e smoke
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - run: cd web && npm ci && npm run build
      - run: cargo build --release -p kc-server -p example-hello
      - run: python3 scripts/e2e_smoke.py --binary target/release/karucode

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  msrv:
    name: msrv (1.82)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  release:
    name: release artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, docs, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - run: cd web && npm ci && npm run build
      - run: cargo build --release -p kc-server -p example-hello
      - name: package
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          target="x86_64-unknown-linux-gnu"
          name="karucode-${version}-${target}"
          mkdir -p "dist/${name}"
          cp target/release/karucode "dist/${name}/"
          cp target/release/example-hello "dist/${name}/" || true
          cp README.md LICENSE config.example.toml "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          cd dist && sha256sum "${name}.tar.gz" > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
