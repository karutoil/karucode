name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap, fast, and the one gate people actually notice. Kept separate so a
  # formatting nit reports in seconds instead of after a full test run.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # A tracked file that imports an untracked one produces a tree that does not
  # compile from a clean clone. That happened once; this job makes it loud.
  #
  # `git status` cannot see it: a fresh `actions/checkout` has no untracked
  # files, so the old version of this job could never fail. The failure mode is
  # only visible from a *working* tree, which is what a contributor has and CI
  # does not. So the gate builds the tree twice instead: once as checked out
  # (catches a repo that is red for whatever reason) and once after deleting
  # every file git does not know about (catches a tracked file that needs an
  # untracked one). The second build is the one the old job was reaching for.
  tracked:
    name: no untracked sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build exactly what git tracks
        run: |
          # Remove anything not in the index (generated bundles, stray files) so
          # the next build sees only committed sources. Keep the two directories
          # that are pure cache/machine output; deleting them would only make the
          # job slower, not stricter (`target` is a build cache, `node_modules`
          # is restored from package-lock.json which *is* tracked).
          git clean -xdfq -e target -e web/node_modules
          # A tracked file that only compiled because of something untracked now
          # fails here, by name.
          cargo check --locked --workspace --all-targets

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # The release profile is not the tested profile: `panic = "abort"` used to
  # disable the runtime's catch_unwind guards in release builds only. Running
  # the runtime suite under --release keeps that class of divergence visible.
  test-release:
    name: test release profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -p kc-runtime -p kc-tools

  # The README is the front door and the only prose file in the release tarball,
  # so its links, anchors and diagrams are checked rather than eyeballed. The
  # checker has its own tests: a guard nobody tests is a guard that rots.
  # Runs on its own: no toolchain, no cache, seconds to finish.
  readme:
    name: readme links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/test_check_readme.py
      - run: python3 scripts/check_readme.py

  # The updater is the script that can take a working service down, and it is
  # shell: no type system will find its mistakes. Its tests run it as a real
  # process against a real git repo with systemctl/cargo/install.sh stubbed, so
  # shellcheck plus a green run here is the whole safety net.
  packaging:
    name: packaging scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -s sh packaging/install.sh packaging/update.sh
      - name: syntax
        run: sh -n packaging/install.sh && sh -n packaging/update.sh
      - name: update.sh tests
        run: python3 tests/test_update.py
      # install.sh's own suite: who the service account is, and where the data
      # goes. Both are decided from the environment, so they are asserted from the
      # real script's --dry-run output rather than from a copy of the logic.
      - name: install.sh tests
        run: python3 tests/test_install_defaults.py
      # The release manifest is what every installed binary downloads and runs, so
      # the producer is tested like the coolant it is: checksums, target discovery
      # and the "nothing to publish" case.
      - name: release manifest tests
        run: python3 tests/test_release_manifest.py

  docs:
    name: docs gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p kc-docs
      - name: docs/internal is up to date
        run: cargo run -p kc-docs -- --check

  # The README says the documentation imports into a static site, so the claim is
  # tested the way a reader would use it: stage the tree, then build it with
  # mkdocs-material in strict mode. Without this job the recipe could rot - the
  # root README is not in docs/, and links that escape the tree only resolve in a
  # repository - and nobody would notice until someone tried to publish it.
  site:
    name: docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pinned: a new major of the generator is a deliberate change, not a CI
      # surprise on an unrelated commit.
      - run: pip install "mkdocs-material==9.8.1"
      - run: python3 tests/test_build_site.py
      - run: python3 scripts/build_site.py
      - run: mkdocs build --strict
        env:
          KARUCODE_SITE_DOCS: .site-docs

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The version is the commit count, so it is only right when the build can see
  # the whole history. `actions/checkout` fetches one commit by default, which
  # would stamp every CI build as build 1 and make the updater's "is this newer"
  # question meaningless. This job proves both halves: a full-history checkout and
  # a binary that reports the number the repository says.
  version:
    name: version stamp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: --version is the commit count
        run: |
          set -eu
          expected="$(git rev-list --count HEAD)"
          # `--no-default-features` skips the frontend bundle: this job needs the
          # CLI, not the UI, and npm would add a minute for nothing.
          printed="$(cargo run --quiet --locked -p kc-server --no-default-features -- --version)"
          echo "printed:  ${printed}"
          echo "expected: karucode ${expected} (...)"
          case "${printed}" in
            "karucode ${expected} "*) ;;
            *)
              echo "::error::--version printed '${printed}' but HEAD is commit ${expected}; a build with a shallow history reports the wrong version"
              exit 1
              ;;
          esac

  # End-to-end against the deterministic mock provider: no network, no API key,
  # no cost. This is the regression gate for the harness itself.
  e2e:
    name: e2e smoke
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - run: cd web && npm ci && npm run build
      - run: cargo build --release -p kc-server -p example-hello
      - run: python3 scripts/e2e_smoke.py --binary target/release/karucode

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  msrv:
    name: msrv (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace

  # Every commit on `main` is a release. The version is the commit count, so there
  # is no version to bump, no changelog to write first and no tag to remember: the
  # merge is the release. A hand-pushed `v<build>` tag is also accepted, provided it
  # names the build that commit really is.
  #
  # The job publishes, next to the tarball and the raw binaries:
  #
  #   updates.json    the manifest every installed server polls (see the `updates`
  #                   topic and crates/kc-server/src/update.rs)
  #   SHA256SUMS      what packaging/install.sh and the staged apply verify against
  #   install.sh      so the tarball can be installed without a checkout
  #
  # Every gate that can fail a normal run also gates a release. The e2e job is
  # deliberately excluded: it boots the real binary, which makes it the slowest job
  # by far, and it already ran on the same commit in this workflow.
  release:
    name: release build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [fmt, tracked, clippy, test, test-release, readme, packaging, docs, web, audit, msrv, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit count *is* the version: a shallow clone would release build 1.
          fetch-depth: 0
      - id: version
        name: decide the build number
        run: |
          set -eu
          build="$(git rev-list --count HEAD)"
          commit="$(git rev-parse --short=12 HEAD)"
          date="$(git log -1 --format=%cI HEAD)"
          echo "build=${build}" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "date=${date}" >> "$GITHUB_OUTPUT"
          echo "Releasing build ${build} (${commit})"
          # A pushed tag is a deliberate re-release: it must name this commit's
          # build, or the tag and the binary would disagree.
          if [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/v}" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "${tag}" != "${build}" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match this commit's build number ${build}; tag v${build} or drop the tag"
              exit 1
            fi
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - name: build
        env:
          KARUCODE_BUILD_NUMBER: ${{ steps.version.outputs.build }}
          KARUCODE_COMMIT: ${{ steps.version.outputs.commit }}
          KARUCODE_COMMIT_DATE: ${{ steps.version.outputs.date }}
        run: |
          set -eu
          cd web && npm ci && npm run build && cd ..
          cargo build --release --locked -p kc-server -p example-hello
          # The stamped number is the whole point: a binary that reports
          # something else would be released under a version it does not have.
          printed="$(./target/release/karucode --version)"
          echo "${printed}"
          case "${printed}" in
            "karucode ${{ steps.version.outputs.build }} "*) ;;
            *) echo "::error::the release binary reports '${printed}'"; exit 1 ;;
          esac
      - name: package
        run: |
          set -eu
          build="${{ steps.version.outputs.build }}"
          target="x86_64-unknown-linux-gnu"
          name="karucode-${build}-${target}"
          mkdir -p dist
          # The raw binaries are what the self-updater downloads: no archive to
          # extract, one checksum to verify, and `updates.json` points at them.
          cp target/release/karucode "dist/${name}"
          cp target/release/example-hello "dist/example-hello-${build}-${target}"
          # The archive is what packaging/install.sh installs, with the installer
          # and unit beside the binary so a host with no checkout can use it.
          stage="dist/pkg/${name}"
          mkdir -p "${stage}"
          cp target/release/karucode "${stage}/"
          cp target/release/example-hello "${stage}/"
          cp README.md LICENSE config.example.toml "${stage}/"
          cp packaging/install.sh packaging/karucode.service "${stage}/"
          tar -C dist/pkg -czf "dist/${name}.tar.gz" "${name}"
          rm -rf dist/pkg
          python3 scripts/release_manifest.py \
            --dist dist \
            --build "${build}" \
            --commit "${{ steps.version.outputs.commit }}" \
            --commit-date "${{ steps.version.outputs.date }}" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/v${build}" \
            --release-url "${{ github.server_url }}/${{ github.repository }}/releases/tag/v${build}" \
            --notes "$(git log -1 --pretty=%B)" \
            --out dist/updates.json \
            --sha256sums dist/SHA256SUMS
          ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.build }}
          name: karucode ${{ steps.version.outputs.build }}
          body: |
            Build ${{ steps.version.outputs.build }} — commit `${{ steps.version.outputs.commit }}`.

            ```bash
            # install or upgrade a service
            curl -fsSLO https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.build }}/karucode-${{ steps.version.outputs.build }}-x86_64-unknown-linux-gnu.tar.gz
            sudo sh packaging/install.sh --tarball karucode-${{ steps.version.outputs.build }}-x86_64-unknown-linux-gnu.tar.gz

            # or let a running install do it
            karucode update --apply
            ```
          files: |
            dist/karucode-*.tar.gz
            dist/karucode-*-x86_64-unknown-linux-gnu
            dist/example-hello-*
            dist/updates.json
            dist/SHA256SUMS
          generate_release_notes: true
