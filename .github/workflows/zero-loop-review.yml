name: Zero-Loop Review

# A stateless, execution-grounded review of the PR diff.  Every finding must be
# backed by a patch-caused analyzer trace, a sandboxed reproduction probe, or a
# verified causal perturbation before it is posted.  Re-pushes are reviewed from
# scratch (base -> head); no prior comment thread is read.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      base:
        description: Base commit or ref
        required: true
      head:
        description: Head commit or ref
        required: true
      pull_number:
        description: PR number to post to (0 = do not post)
        required: false
        default: "0"

permissions:
  contents: read
  pull-requests: write
  checks: read

concurrency:
  group: zero-loop-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  ZERO_LOOP_PLUGIN_REPO: karutoil/karucode-plugins
  ZERO_LOOP_PLUGIN_PATH: .zero-loop/plugin
  PYTHONUNBUFFERED: "1"

jobs:
  review:
    name: zero-loop
    # Fork and Dependabot pull_request runs do not receive repository secrets,
    # so they cannot reach the model.  Do not turn that into a red check: skip
    # the job (a same-repo branch can be reviewed normally), and never fall back
    # to pull_request_target, which would expose the model key to PR code.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Require a pinned reviewer commit
        env:
          PLUGIN_REF: ${{ vars.ZERO_LOOP_PLUGIN_REF }}
        run: |
          if ! printf '%s' "$PLUGIN_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::ZERO_LOOP_PLUGIN_REF must be a full 40-character commit SHA (got '${PLUGIN_REF:-<unset>}')"
            exit 1
          fi

      - name: Check out the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the reviewer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.ZERO_LOOP_PLUGIN_REPO }}
          ref: ${{ vars.ZERO_LOOP_PLUGIN_REF }}
          path: ${{ env.ZERO_LOOP_PLUGIN_PATH }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install reviewer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pydantic>=2.6" "httpx>=0.27" "semgrep>=1.90,<2"

      # CIVER syntax-checks Rust repairs with rustfmt; the language is installed
      # anyway because this repository is a Rust workspace.
      - name: Install Rust syntax checker
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt

      - name: Fetch Rust dependencies for sandbox probes
        run: cargo fetch --locked

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies for the TypeScript parse check
        run: npm ci --prefix web --no-audit --no-fund

      - name: Pull the probe images
        run: |
          docker pull docker.io/library/python:3.12-alpine
          docker pull docker.io/library/rust:1.89-slim
          docker pull docker.io/library/node:22-alpine
          docker pull docker.io/library/golang:1.23-alpine

      - name: Write the reviewer configuration
        env:
          BASE_URL: ${{ vars.ZERO_LOOP_LLM_BASE_URL || 'https://omni.karutoil.site/v1' }}
          MODEL: ${{ vars.ZERO_LOOP_MODEL || 'deepseek-v4.1-flash' }}
        run: |
          cat > "$RUNNER_TEMP/zero-loop.toml" <<EOF
          [llm]
          base_url = "${BASE_URL}"
          api_key_env = "ZERO_LOOP_LLM_API_KEY"
          timeout_secs = 600
          max_retries = 2

          [model]
          primary = "${MODEL}"
          reasoning_effort = "high"
          triage_reasoning_effort = "low"
          probe_reasoning_effort = "medium"
          monitor_reasoning_effort = "medium"
          max_tokens = 65536
          triage = "${MODEL}"
          security = "${MODEL}"
          probe = "${MODEL}"
          reviewer = "${MODEL}"
          monitor = "${MODEL}"

          [review]
          deadline_secs = 3600
          decomposition = true
          stage2_timeout_secs = 180
          max_model_tokens = 500000
          max_findings = 0
          probe_attempts = 3
          probe_workers = 4

          [sandbox]
          runtime = "docker"
          image = "docker.io/library/python:3.12-alpine"
          rust_image = "docker.io/library/rust:1.89-slim"
          node_image = "docker.io/library/node:22-alpine"
          go_image = "docker.io/library/golang:1.23-alpine"
          extra_args = "--uts=host --volume=/home/runner/.cargo/registry:/usr/local/cargo/registry:ro --volume=/home/runner/.cargo/git:/usr/local/cargo/git:ro"
          timeout_secs = 180

          [sast]
          semgrep_bin = "semgrep"
          timeout_secs = 55

          [gate]
          # One provider key is available in this repository.  The plugin records
          # pool_disjointness_unverified instead of pretending the pools differ.
          cross_provider_audit = false
          require_checks = ""

          [ci]
          provider = "github"
          token_env = "GITHUB_TOKEN"
          EOF

      - name: Run the review
        id: review
        shell: bash
        env:
          ZERO_LOOP_LLM_API_KEY: ${{ secrets.ZERO_LOOP_LLM_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head }}
        run: |
          set +e
          if [ -z "${ZERO_LOOP_LLM_API_KEY:-}" ]; then
            echo "::error::ZERO_LOOP_LLM_API_KEY is not configured for this repository."
            echo "Set it with: gh secret set ZERO_LOOP_LLM_API_KEY --repo ${GITHUB_REPOSITORY}"
            exit 2
          fi
          base_sha="${{ github.event.pull_request.base.sha || inputs.base }}"
          git fetch --no-tags origin "$base_sha" >/dev/null 2>&1 || true
          args=(--config "$RUNNER_TEMP/zero-loop.toml" --workspace "$GITHUB_WORKSPACE" --out-dir "$RUNNER_TEMP/zero-loop-out" --state-dir "$RUNNER_TEMP/zero-loop-state")
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            args=(ci --payload "$GITHUB_EVENT_PATH" --provider github --head-sha "$HEAD_SHA" "${args[@]}")
          else
            args=(review --base "$base_sha" --head "$HEAD_SHA" --json "${args[@]}")
          fi
          "$ZERO_LOOP_PLUGIN_PATH/kc-zero-loop-reviewer/bin/zero-loop-reviewer" "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/zero-loop-review.txt"
          code=${PIPESTATUS[0]}
          {
            echo "### Zero-loop review"
            echo
            echo "Exit code: \`$code\` (0 approve, 1 request changes, 2 human review)"
            echo
            sed -n '1,220p' "$RUNNER_TEMP/zero-loop-review.txt"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Upload review receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zero-loop-receipts
          path: |
            ${{ runner.temp }}/zero-loop-out
            ${{ runner.temp }}/zero-loop-state/receipts
          if-no-files-found: warn
          retention-days: 14
