# A stranger who does not fit either form can always file a blank issue, and the
# forms are there to make a good report easy, not to gate one.
blank_issues_enabled: true
contact_links:
  - name: Security
    url: https://github.com/karutoil/karucode/security
    about: Report vulnerabilities through private vulnerability reporting, not public issues.
  - name: Documentation
    url: https://github.com/karutoil/karucode/tree/main/docs
    about: HTTP API, architecture, plugins, MCP and the security model live in docs/.
  - name: Operator guide
    url: https://github.com/karutoil/karucode/tree/main/packaging
    about: Installing, backing up, upgrading and running as a service.
