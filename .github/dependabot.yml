version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine patch bumps instead of twenty.
      patch-and-minor:
        applies-to: version-updates
        update-types: ["patch", "minor"]

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      patch-and-minor:
        applies-to: version-updates
        update-types: ["patch", "minor"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
