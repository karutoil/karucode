[package]
name = "kc-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "karucode"
path = "src/main.rs"

[features]
default = ["embed-ui"]
# Embed `web/dist` into the binary. Disable for a minimal build that only serves
# from KARUCODE_WEB_DIR.
embed-ui = ["dep:rust-embed"]

[dependencies]
kc-core.workspace = true
kc-store.workspace = true
kc-provider.workspace = true
kc-tools.workspace = true
kc-runtime.workspace = true
kc-plugin-host.workspace = true
kc-plugin-sdk.workspace = true
kc-mcp.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
futures-util.workspace = true
libc.workspace = true
mime_guess.workspace = true
reqwest.workspace = true
rust-embed = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
rusqlite.workspace = true
tokio-tungstenite = "0.24"
