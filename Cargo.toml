[workspace]
resolver = "2"
members = [
  "crates/kc-core",
  "crates/kc-store",
  "crates/kc-provider",
  "crates/kc-tools",
  "crates/kc-runtime",
  "crates/kc-plugin-sdk",
  "crates/kc-plugin-host",
  "crates/kc-mcp",
  "crates/kc-docs",
  "crates/kc-server",
  "plugins/example-hello",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.dependencies]
kc-core = { path = "crates/kc-core" }
kc-store = { path = "crates/kc-store" }
kc-provider = { path = "crates/kc-provider" }
kc-tools = { path = "crates/kc-tools" }
kc-runtime = { path = "crates/kc-runtime" }
kc-plugin-sdk = { path = "crates/kc-plugin-sdk" }
kc-plugin-host = { path = "crates/kc-plugin-host" }
kc-mcp = { path = "crates/kc-mcp" }
kc-docs = { path = "crates/kc-docs" }

anyhow = "1"
async-trait = "0.1"
bytes = "1"
futures-util = "0.3"
futures-core = "0.3"
globset = "0.4"
ignore = "0.4"
libc = "0.2"
parking_lot = "0.12"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors", "compression-gzip"] }
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
sha2 = "0.10"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = 1
incremental = true
