[workspace]
resolver = "2"
members = [
  "crates/kc-core",
  "crates/kc-store",
  "crates/kc-provider",
  "crates/kc-tools",
  "crates/kc-runtime",
  "crates/kc-plugin-sdk",
  "crates/kc-plugin-host",
  "crates/kc-mcp",
  "crates/kc-docs",
  "crates/kc-server",
  "plugins/example-hello",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
# Proven, not guessed: `cargo +1.89.0 check --workspace --all-targets` succeeds and
# `cargo +1.88.0 check` refuses the graph ("uuid@1.29.0 requires rustc 1.89.0").
# 1.88 is also the floor for globset/ignore/sha2 and 1.85 for the edition-2024
# crates (hashbrown, chacha20), so 1.89 is the highest of the requirements. CI's
# `msrv` job runs this same number.
rust-version = "1.89"

[workspace.dependencies]
kc-core = { path = "crates/kc-core" }
kc-store = { path = "crates/kc-store" }
kc-provider = { path = "crates/kc-provider" }
kc-tools = { path = "crates/kc-tools" }
kc-runtime = { path = "crates/kc-runtime" }
kc-plugin-sdk = { path = "crates/kc-plugin-sdk" }
kc-plugin-host = { path = "crates/kc-plugin-host" }
kc-mcp = { path = "crates/kc-mcp" }
kc-docs = { path = "crates/kc-docs" }

anyhow = "1"
async-trait = "0.1"
base64 = "0.23"
bytes = "1"
futures-util = "0.3"
futures-core = "0.3"
globset = "0.4"
ignore = "0.4"
libc = "0.2"
parking_lot = "0.12"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors", "compression-gzip"] }
# `debug-embed` makes dev builds embed the UI too: rust-embed's default is to
# read the folder from disk at runtime in debug builds, which quietly turned
# `cargo run` into a build that needed `web/dist` on the machine.
rust-embed = { version = "8", features = ["include-exclude", "debug-embed"] }
mime_guess = "2"
sha2 = "0.10"
# Plugin installs (`karucode plugin install`): stream a GitHub tarball and
# unpack it in-process. `tar` needs no extra feature flags for plain archives.
tar = "0.4"
flate2 = "1"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = true
# `unwind`, not `abort`: the runtime contains panics from tools, providers and
# subagents with `catch_unwind` (kc-runtime/src/agent.rs, subagent.rs). Under
# `panic = "abort"` those guards cannot catch, so one panicking tool would abort
# the whole server and kill every in-flight run and SSE client. The tests run
# under the dev profile, so `abort` here made the release binary behave
# differently from the tested one on exactly the failure path the guards exist
# for. `cargo test --release -p kc-runtime` in CI keeps this honest.
panic = "unwind"

[profile.dev]
opt-level = 0
debug = 1
incremental = true
