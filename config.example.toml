# karucode configuration example.
#
# Copy to ~/.config/karucode/config.toml (or point KARUCODE_CONFIG at it).
# Precedence: UI/DB overrides > environment variables > this file > defaults.
# Set KARUCODE_LOCK_SETTINGS=1 to ignore UI/DB overrides (env becomes truth).
# Environment booleans accept 1/0, true/false, yes/no or on/off (case-insensitive).
# Any other present value stops startup with an error naming that variable.
# The KARUCODE_* model variables (KARUCODE_MODEL, KARUCODE_BASE_URL,
# KARUCODE_API_KEY / OPENAI_*) override the [[providers]] tables below.

host = "127.0.0.1"          # remote binds require auth_token
port = 8787
workspace = "/home/me/project"
data_dir = "/home/me/.local/share/karucode"
# auth_token = "at-least-16-characters"
# Separate credential required to change the approval mode, the model endpoint or
# the provider list over `PATCH /api/config` (header `X-Karucode-Admin-Token`).
# Without it, any API client can turn approvals off and then repoint the provider
# at itself. Env: KARUCODE_ADMIN_TOKEN.
# admin_token = "a-different-long-secret"
# Optional allowlist for where a project may be created. Unset - the default -
# means any existing directory (except `/`), which is what a single-operator
# install wants. Set it on a shared or remotely reachable deployment.
# Env: KARUCODE_PROJECT_ROOTS (colon-separated).
# project_roots = ["/home/me/projects", "/srv/code"]
# Let the file tools reach the system temporary directory (`TMPDIR`, else /tmp)
# as well as the project. On by default: build output, screenshots, downloads and
# browser profiles land there, and a path error for them is noise, not
# protection. It is a second root, not a wider project: `..` out of it and
# symlinks pointing elsewhere are still refused. Set false for project-only
# confinement. Env: KARUCODE_ALLOW_TEMP_DIR.
# allow_temp_dir = true
# Delete messages older than this many days (the newest 100 per session are
# always kept). 0 keeps everything and is the default. When set, a retention
# pass runs once an hour and then hands the freed pages back to the filesystem;
# the setting is re-read every hour, so changing it takes effect on the next
# pass. Env: KARUCODE_RETENTION_DAYS.
# retention_days = 0
log_level = "info"

[model]
provider = "openai_compatible"
# Any OpenAI-compatible gateway works (LiteLLM, vLLM, Ollama /v1, OpenRouter, ...).
base_url = "http://127.0.0.1:4000/v1"
model = "gpt-4o-mini"
# Prefer KARUCODE_API_KEY / OPENAI_API_KEY in the environment over this file.
# api_key = "sk-..."
temperature = 0.2
# Send that temperature at all? Off (the default) sends none, which is what other
# harnesses do and what this model behaves best with: a forced sampling value can
# push a reasoning model into repeating itself instead of acting.
send_temperature = false
# max_tokens = 4096
request_timeout_secs = 300
parallel_tool_calls = true
# Does this model accept IMAGE input? Off by default, and never guessed from the
# model id: an endpoint accepts an image for a text-only model and either drops
# it or fails the turn, and a model that never saw the picture will describe it
# anyway. With this on, read_file on a PNG/JPEG/GIF/WebP attaches the pixels to
# the tool result; with it off, the model is told plainly that it cannot see
# images (which is what you want it to say). A `vision = true` on a
# [[providers.models]] entry overrides this per model, so a session pinned to a
# vision model can read images while this stays off.
supports_images = false

# Retry budget (global: it applies to every provider profile). Retries are
# classified, not blanket: connection resets, timeouts, 408/409/425/429 and 5xx
# are retried, because those are transient. A 400/413/422 is NOT retried — a
# malformed request stays malformed, and re-sending it 50 times turns a clear
# error into a twenty-minute hang. 401/403/404 are not retried either, unless the
# profile sets `aggregator = true` (see below), where the same status usually
# means "this channel's key is dead" and the next attempt lands elsewhere.
# Retries stop as soon as real content has been streamed, so nothing is ever
# duplicated.
#
# The body outvotes the status in one direction only: a refusal that names a rate
# limit, a cooldown or a reset window ("tier_limit_exceeded", "reset after 2m",
# `"reset_seconds": 1024`) is retried whatever status carried it, because that is
# a condition which clears by itself. When the body names its window, the attempt
# waits that long instead of the exponential — and when the window is longer than
# `retry_max_total_secs`, it fails at once and says so rather than crawling a
# backoff towards a reset it can never reach. Quota and balance wording is not in
# that list: `insufficient_quota` needs a recharge, not another attempt.
# retry_max_retries = 50      # attempts = retries + 1; 0 disables retries
# retry_base_delay_ms = 500   # first delay; doubles per attempt (jittered)
# retry_max_delay_ms = 30000  # backoff ceiling
# retry_max_total_secs = 300  # wall-clock ceiling for the whole chain; 0 = attempts only
# Env equivalents: KARUCODE_RETRY_MAX_RETRIES, KARUCODE_RETRY_BASE_DELAY_MS,
# KARUCODE_RETRY_MAX_DELAY_MS, KARUCODE_RETRY_MAX_TOTAL_SECS.

# [model.extra_headers]
# "X-Gateway-Project" = "karucode"

# --- Provider profiles (optional) -------------------------------------------
# Named endpoints instead of the single [model] connection. With at least one
# [[providers]] table present, the connection fields of [model] (provider,
# base_url, model, api_key, request_timeout_secs, extra_headers, extra_body,
# aggregator) are ignored and the active profile supplies them. Sampling
# (temperature, max_tokens, top_p, parallel_tool_calls) and the retry budgets
# (retry_max_retries, retry_base_delay_ms, retry_max_delay_ms,
# retry_max_stream_restarts, retry_max_total_secs) still come from [model].
#
# KARUCODE_MODEL / KARUCODE_BASE_URL / KARUCODE_API_KEY (or OPENAI_BASE_URL /
# OPENAI_API_KEY) override this whole section: they become the active "env"
# profile. The flat [model] request timeout, extra_headers, extra_body and
# aggregator carry over; KARUCODE_REQUEST_TIMEOUT_SECS overrides that timeout.
# KARUCODE_MODELS_DEV_URL points the model-library catalog at a mirror
# (default https://models.dev/api.json; read once at startup, http(s) only).
#
# active_provider = "gateway"
# active_model = "claude-sonnet"
#
# [[providers]]
# id = "gateway"                   # 1-64 chars: letters, digits, '.', '_', '-'
# name = "LiteLLM gateway"
# provider = "openai_compatible"
# base_url = "http://127.0.0.1:4000/v1"
# api_key = "sk-litellm"           # write-only: the browser only sees api_key_set
# request_timeout_secs = 300
# aggregator = true                # multi-channel proxy: retry 401/403/404 too
#                                  # (a dead channel's key, not a bad request)
#
#   [[providers.models]]
#   id = "claude-sonnet"           # the id sent to the endpoint (unique per profile)
#   name = "Claude Sonnet"         # label; falls back to the id
#   context_window = 200000        # decides the request budget: (window - output) x 4 x 0.95 chars
#   max_output_tokens = 8192       # reserved out of the window so the answer always fits
#   tool_call = true
#   reasoning = true
#   vision = true                  # takes image input: read_file attaches the pixels.
#                                  # The settings screen prefills this from models.dev.
#   cost_input = 3.0               # USD per million input tokens
#   cost_output = 15.0
#   # catalog_provider = "anthropic"   # models.dev provider it was prefilled from
#
#   [[providers.models]]
#   id = "qwen2.5-coder-32b"
#   name = "Qwen2.5 Coder 32B"
#   context_window = 131072
#   tool_call = true
#
# [[providers]]
# id = "local-vllm"
# name = "vLLM on this box"
# base_url = "http://127.0.0.1:8000/v1"
#
#   [[providers.models]]
#   id = "Qwen/Qwen2.5-Coder-32B-Instruct"
#   context_window = 32768
#   tool_call = true

[limits]
# Model turns in one run. 0 = no ceiling, which is the default: a long task is
# not interrupted by a counter, and nothing is appended to the transcript to
# "resume" it. A non-zero value is a hard stop (the run ends limit_reached).
# What keeps a runaway in control is the wall clock below plus the loop guard,
# which stops a run whose turns only return answers it already has.
max_iterations = 0
# Hard wall-clock ceiling for the whole run (24h).
max_run_secs = 86400
max_tool_output_bytes = 24000
max_command_output_bytes = 32000
command_timeout_secs = 120
max_command_timeout_secs = 600
max_file_read_bytes = 200000
# Largest image read_file will hand a vision model, in bytes. The bytes are
# base64-encoded into the transcript and resent on every later turn of the
# session, so this is a cost knob as much as a read limit. 4 MiB covers a
# full-screen screenshot; raise it for design work, lower it to keep image-heavy
# sessions cheap.
max_image_read_bytes = 4194304
search_max_results = 200
# How much conversation may be sent to the model, in characters.
#
# 0 (the default) DERIVES it from the resolved model: its context_window minus
# the room its answer needs, at four characters per token - so a 1M-token model
# gets ~2.5M chars and a 32k model ~110k. A non-zero value is an install-wide
# *ceiling*: it can only lower the derived budget, never raise it past what the
# model accepts. Leave it at 0 unless you deliberately want less context than
# the model can hold.
context_max_chars = 0
# Safety valve against a runaway tool batch, not a work budget.
max_tool_calls_per_turn = 32
# How many times a turn the provider gave up on is asked again, after a wait.
#
# The two retry budgets under [model] (retry_max_retries, and
# retry_max_stream_restarts) both spend attempts in the same second. When they are
# spent the run used to end, and the only recovery was typing the prompt again.
# This layer spends time instead: the same turn is asked again once the upstream
# has had a chance to recover. It only engages for a failure a wait can fix - a
# transient status (408/409/425/429/5xx), a body naming a rate limit, cooldown or
# reset window, or a transport death with no status at all. A dead key (401), a
# content refusal, a request the endpoint judged and a context overflow still end
# the run at once with their real reason.
#
# 2 by default; 0 disables the layer; the ceiling is 10. Each retry is a fresh
# generation, and every one is announced (a stream_retry event plus a warning
# notice naming the attempt and the wait). Nothing of a failed attempt is
# persisted, so a retry can never duplicate an answer.
max_turn_retries = 2
# Wait before the first turn retry, in milliseconds. Doubles per retry, capped at
# eight times this value (30 s, 60 s, 120 s by default).
turn_retry_delay_ms = 30000
# Run a turn's INDEPENDENT tool calls at the same time instead of one at a time.
# On by default: reads, and file writes to different paths that the approval
# policy would not ask about, overlap; results still land in the transcript in
# call order, so only the wall clock changes. Off runs every call in order (the
# behaviour before this switch existed) - reach for it when a turn's writes must
# be observed in sequence, or when a provider or plugin misbehaves under
# concurrent calls. Shell commands, plugin/MCP tools, subagent spawns and
# anything that has to ask for approval always run in order either way. Not the
# same key as model.parallel_tool_calls (which asks the endpoint for several
# calls in one turn). KARUCODE_PARALLEL_TOOL_CALLS sets the same value.
parallel_tool_calls = true

[approvals]
# ask | ask_commands | auto | read_only
mode = "ask"
# Prefixes that never prompt in ask modes; matching stops at a word boundary,
# so "rg" allows bare `rg` and `rg TODO .` but not `rgx`. Options that execute
# another program still prompt: rg --pre, --pre-glob and --hostname-bin.
allow_commands = ["rg", "git status", "cargo test", "cargo check"]
# Workspace-relative prefixes that may be written without prompting in ask mode.
auto_approve_paths = []
timeout_secs = 300

[subagents]
# Subagent loops running at once, install-wide. 0 = no ceiling: every spawn is
# granted a slot immediately and a spawn_agents fan-out starts every child. Each
# live loop is a provider stream and a transcript, so an unbounded value makes
# cost the only limit - the small default is deliberate.
max_concurrent = 3
# Live detached agents one session may keep running at once. 0 = no ceiling.
# `allow_background = false` is the switch that turns background work off.
max_background = 8
allow_background = true
# Model turns for one subagent. 0 = no ceiling (the default): a delegated coding
# task is a whole piece of work, so `timeout_secs` below is what ends it.
max_iterations = 0
allow_recursive = false
# Generations of subagents that may nest below a run. 0 = no delegation at all;
# the field holds at most 255.
max_depth = 1
# Wall clock for one delegated task (4h).
timeout_secs = 14400

# Reusable instruction packs the agent loads on demand. A skill is a Markdown page
# - normally `<dir>/<name>/SKILL.md`, with optional YAML frontmatter - holding one
# procedure this project or this machine has already worked out: how to cut a
# release here, which migration order this database needs. It is not project
# instructions (AGENTS.md): instructions are always in the prompt, a skill is
# opened only when the task matches its description. Only one line per skill
# reaches the prompt; the body is read with the `skill` tool, so ten skills do not
# cost ten pages per turn.
#
# `KARUCODE_SKILLS_ENABLED`, `_AUTO_DETECT`, `_PROMPT` and `_DIRECTORIES`
# (comma-separated) override these. Skills can also be added, hidden and deleted
# from Settings → Skills or with `/api/skills`; see docs/API.md.
[skills]
enabled = true           # master switch: `false` drops the prompt block and
                         # makes the `skill` tool answer that skills are disabled
auto_detect = true       # scan the conventional folders: in the workspace
                         # .karucode/skills, .claude/skills, .agents/skills,
                         # .agent/skills; in $HOME .karucode/skills, .claude/skills,
                         # .agents/skills, .config/karucode/skills
directories = []         # extra folders to scan; `~` expands, a relative path
                         # resolves against the workspace, a missing folder is not
                         # an error. A workspace skill shadows a user skill with
                         # the same id
prompt = true            # list the available skills in the system prompt. The
                         # `skill` tool works either way, so `false` keeps the
                         # feature and stops spending prompt bytes on it
prompt_max_chars = 4000  # prompt characters reserved for that list (200 .. 64000);
                         # the block says so when it cuts a skill
max_skills = 64          # most skills the registry keeps (1 .. 512)
# `disabled` and `custom` exist here too, but the web UI and POST/PATCH/DELETE
# /api/skills write them: `disabled` is the list of ids turned off (they stay
# discovered, just hidden) and `custom` is the skills pasted in rather than found
# on disk. Both live in the settings table, so an added skill survives a restart
# without a file. Editing them by hand is not refused, but the UI will not know.

# Tell a human when something happened: a run settled, an approval is waiting, a
# run failed. On by default; every switch below is also editable in Settings and
# through PATCH /api/config, and overridable from the environment.
[notifications]
# The master switch. `false` stops the server emitting the event at all, so no
# client has to cooperate — and `KARUCODE_NOTIFICATIONS=0` does the same for a
# locked deployment without touching this file.
enabled = true
# Per-event switches. They answer "which pings are worth interrupting me for",
# independently of the master switch above.
run_finished = true
# An approval is pending, or a run stopped at a limit and can continue.
needs_input = true
# A run failed, a restart interrupted it, or a subagent failed.
error = true
# Notifications a plugin raises as information rather than as a problem.
info = true
# Let plugins raise notifications at all (the `notify` frame), and let them
# observe notifications with the `on_notify` hook. Enforced in the plugin host, so
# `false` refuses both whatever a plugin sends.
plugin = true
# Skip notifications for runs shorter than this many seconds (0 = every run, and
# the default). A two-second question is noise to most people.
min_run_secs = 0
# Include the first line of the answer as the notification body. `false` sends the
# title only, which keeps model output off a lock screen. Error text always travels:
# "Run failed" with no reason is not actionable.
say_body = true
# Let temporary (ephemeral) sessions notify. Off by default: a temporary chat
# deletes itself when its work ends, so a notification about it usually arrives
# after the row is gone, and the program that created it already holds the answer.
ephemeral_sessions = false

# Out-of-process plugins (JSON-RPC over stdio).
# [[plugins]]
# name = "example-hello"
# command = ["example-hello"]
# enabled = true
# permissions = ["files.read"]

# Hot plugin reloads. Off by default: a reload replaces plugin processes, so it is
# an explicit choice. With it on, the server re-reads the [[plugins]] entries above
# and every <data_dir>/plugins/*/plugin.toml, and applies adds, removals and
# rebuilt binaries without a restart. `POST /api/plugins/reload` does the same
# thing on demand. The interval is clamped to 1..=600 seconds.
# plugins_watch = true
# plugins_watch_secs = 2

# [[mcp_servers]]
# name = "filesystem"
# transport = "stdio"
# command = ["npx", "-y", "@modelcontextprotocol/server-filesystem", "/home/me/project"]
# require_approval = true

# [[mcp_servers]]
# name = "remote"
# transport = "http"
# url = "http://127.0.0.1:3001/mcp"
# [mcp_servers.headers]
# Authorization = "Bearer ..."

# Hot MCP reloads. Off by default: a reload replaces server processes, so it is an
# explicit choice. With it on, the server re-reads the [[mcp_servers]] entries above
# and applies adds, removals and changed entries without a restart.
# `POST /api/mcp/reload` does the same thing on demand, and
# `POST /api/mcp/<name>/reload` replaces one server. The interval is clamped to
# 1..=600 seconds.
# mcp_watch = true
# mcp_watch_secs = 2

# --- terminals -------------------------------------------------------------
# The terminal tab: a real PTY per sub-tab, running as the server user. This is
# a shell for the *operator*, not a model tool, so it does not ask for approval;
# `approvals.mode` does not gate it. Turn it off on a shared host.
# `KARUCODE_TERMINALS=0`, `_SHELL`, `_SCROLLBACK_BYTES`, `_MAX`, and
# `KARUCODE_TERMINAL_IDLE_SECS` override these.
[terminals]
enabled = true
# shell = "/bin/sh"          # default: $SHELL, else /bin/sh
scrollback_bytes = 262144    # replay ring per terminal, 256 KiB (4 KiB .. 4 MiB)
max_terminals = 16           # per install (1 .. 64); further creates are refused
idle_timeout_secs = 43200    # an idle shell is reaped after 12 hours

# --- session titles --------------------------------------------------------
# AI-written session titles, on by default. One cheap extra request after the
# first user message; it never blocks the run and never overwrites a name you
# set yourself. Leave `provider`/`model` empty to use the session's own model.
# `KARUCODE_TITLES`, `_PROVIDER`, `_MODEL` override these.
[titles]
enabled = true
# provider = "gateway"       # a [[providers]] id; default = the session's own
# model = "claude-haiku"     # default = the session's model
max_chars = 60               # hard cap on a generated title (8 .. 120)
timeout_secs = 20            # give up and keep the derived title

# --- web-UI access ---------------------------------------------------------
# Who may use the browser UI, and the address it answers to. The *credentials*
# (a password hash and passkey public keys) are not configuration: they live in
# the SQLite settings table and are managed from Settings -> Access or the
# onboarding wizard. This section is only the policy around them.
#
# `KARUCODE_ACCESS_ENABLED`, `KARUCODE_PUBLIC_URL`, `KARUCODE_SESSION_DAYS`,
# `KARUCODE_TUNNEL` and `KARUCODE_TRUSTED_PROXIES` override these.
#
# `enabled = true` with no password or passkey is refused at startup with a
# non-loopback bind, and `PATCH /api/config` refuses it outright: that edit would
# leave a login screen nobody can pass. Set the credential first.
[access]
enabled = false                          # require a password/passkey for the web UI
# public_url = "https://karucode.example.com"
                                         # the address people type; added to the
                                         # Host allowlist, sets `Secure` on the
                                         # cookie, and is the origin a passkey is
                                         # bound to
session_days = 30                        # how long one browser stays signed in (1..365)
tunnel = "none"                          # none | cloudflare | custom
trusted_proxies = []                     # IPs/CIDRs whose X-Forwarded-* are believed
                                         # (e.g. ["10.0.0.0/8", "172.17.0.1"]).
                                         # Loopback is always trusted; `cloudflare`
                                         # adds Cloudflare's published ranges.

# --- updates ---------------------------------------------------------------
# karucode has no release trains: every commit on `main` is a release and the
# version is the commit count, so an update is simply a higher build number.
# A release publishes `updates.json` beside its artifacts, and this section
# decides whether the server looks at it.
#
# Environment overrides: KARUCODE_UPDATE_CHECK, KARUCODE_UPDATE_CHECK_SECS,
# KARUCODE_UPDATE_MANIFEST_URL, KARUCODE_UPDATE_AUTO_APPLY.
#
# Checking is one small GET and touches nothing. Installing replaces the binary
# this process is running from and needs write access to it - a systemd install
# usually does not have that, so the download is staged and verified and a human
# runs `sudo karucode update --apply --data-dir <dir>`. Settings -> Updates shows
# that exact command. A container install is updated by rebuilding the image.
[updates]
check = true                             # look for a newer build (default)
check_secs = 21600                       # 6 hours; clamped to 300 .. 604800
manifest_url = "https://github.com/karutoil/karucode/releases/latest/download/updates.json"
                                         # point this at a mirror you control to
                                         # choose who supplies your binaries
auto_apply = false                       # install automatically when a newer
                                         # build is found AND this process may
                                         # write its own binary (off: never)
